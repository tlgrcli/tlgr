# Keeps the SHA-pinned GitHub Actions and the Python dependencies current.
# Action pins carry their tag as a trailing comment, which Dependabot updates
# along with the SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
