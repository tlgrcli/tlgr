name: ci

on:
  push:
    branches: ["main", "feat/**", "design/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # 3.14 is allowed to fail: it is a forward-looking signal, not a gate.
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install project
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy (strict set)
        run: |
          uv run mypy tlgr/models tlgr/ops tlgr/registry.py tlgr/schema.py \
            tlgr/core/errors.py tlgr/core/timefmt.py tlgr/core/pagination.py

      - name: pytest
        run: uv run pytest -q --cov=tlgr --cov-report=term-missing
