[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlgr"
dynamic = ["version"]
description = "Full Telegram account control CLI — agent-friendly, daemon-based, with webhook event push"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "tlgrcli"}
]
keywords = ["telegram", "cli", "automation", "telethon", "agent", "webhook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    # Pinned to the minor: tlgr reads a handful of Telethon internals
    # (`_save_states_and_entities`, raw TL constructors at layer 227), and a
    # minor bump has moved those before. `~=1.44.0` allows 1.44.x patches only.
    "telethon~=1.44.0",
    "click>=8.0",
    "aiohttp>=3.9",
    # msgspec is the single wire-shape definition (models, requests, schema).
    "msgspec>=0.18,<1.0",
    "tomli>=2.0;python_version<'3.11'",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Without pytest-asyncio every `@pytest.mark.asyncio` test ERRORS on an
# unknown mark instead of running — 13 of them did exactly that, and the
# suite reported them as ordinary failures, so a red run looked like known
# breakage rather than "your async tests never executed".
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Optional accelerators and format handlers. None of them are imported at
# module scope; a missing extra degrades a feature, it never breaks a command.
fast = ["cryptg>=0.4"]
proxy = ["python-socks[asyncio]>=2.4"]
media = ["pillow>=10.0", "hachoir>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tlgr/cli/legacy", "*.md"]  # design docs contain illustrative, not runnable, snippets

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is formatter business, not lint business
    "B008",    # click decorators legitimately call in defaults
    "SIM108",  # ternaries are not always clearer
    "RUF001", "RUF002", "RUF003",  # the docs and tests are full of real Unicode
]

# The v1 modules below are rewritten or deleted by their own group PR
# (ARCHITECTURE §2.4). Restyling them now would bury the foundation diff in
# unrelated churn, so their remaining nits are parked rather than fixed.
[tool.ruff.lint.per-file-ignores]
# RUF012: msgspec turns a mutable Struct default into a default_factory, so
# `list[str] = []` is the documented spelling, not a shared-mutable bug.
# UP007: `Unset` is a generic alias; `X | Y` over a TypeVar is not subscriptable
# on 3.10, so typing.Union is the only form that works there.
"tlgr/models/*" = ["RUF012", "UP007"]
"tlgr/ops/*" = ["RUF012"]
# B017: several tests assert only that *something* was raised and then
# check `classify(exc)`, because the exact class is the daemon's business
# and the code/exit status is the contract.
"tests/*" = ["B011", "B017", "SIM117", "RUF059", "RUF012"]
"tlgr/cli/__init__.py" = ["SIM102"]
"tlgr/cli/legacy/*" = ["SIM102", "SIM105", "F401", "F841", "B904"]
"tlgr/cli/account.py" = ["SIM105", "F841"]
"tlgr/cli/config_cmd.py" = ["SIM105", "F401"]
"tlgr/core/accounts.py" = ["SIM105"]
"tlgr/core/client.py" = ["SIM102", "SIM105", "B904"]
"tlgr/daemon/server.py" = ["SIM105", "RUF006"]
"tlgr/daemon/webhook.py" = ["SIM102", "SIM105"]
"tlgr/filters/*" = ["SIM102"]
"tlgr/gateway/engine.py" = ["RUF059"]
"tlgr/ipc_client.py" = ["B904", "F841"]
"tlgr/jobs/base.py" = ["SIM105"]
"tlgr/processors/__init__.py" = ["F811"]

[tool.ruff.format]
quote-style = "double"

# Strict typing is enforced on the v2 foundation only. The v1 modules under
# tlgr/cli/legacy and the not-yet-migrated core keep their existing looseness
# until their group PR rewrites them.
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
# Errors are reported for the files named on the command line only. The v1
# modules the strict set imports are type-checked for their signatures but
# not held to strict rules they were never written for.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "tlgr.models.*",
    "tlgr.ops.*",
    "tlgr.registry",
    "tlgr.schema",
    "tlgr.core.errors",
    "tlgr.core.timefmt",
    "tlgr.core.pagination",
    "tlgr.core.config",
    "tlgr.core.paths",
    "tlgr.core.peers",
    "tlgr.core.logging",
    "tlgr.core.identity",
    "tlgr.transport.*",
    "tlgr.daemon.session",
    "tlgr.daemon.sessions",
    "tlgr.daemon.events",
    "tlgr.daemon.ratelimit",
    "tlgr.daemon.policy",
    "tlgr.daemon.idle",
    "tlgr.daemon.singleton",
    "tlgr.daemon.peercred",
    "tlgr.version",
]
strict = true

[tool.coverage.run]
source = ["tlgr"]
omit = ["tlgr/cli/legacy/*"]

[project.urls]
Homepage = "https://github.com/tlgrcli/tlgr"
Repository = "https://github.com/tlgrcli/tlgr"
Issues = "https://github.com/tlgrcli/tlgr/issues"

[project.scripts]
tlgr = "tlgr.cli:cli"

[tool.setuptools.dynamic]
version = {attr = "tlgr.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tlgr*"]

# The catalog index and the waiver list are data the runtime reads: `tlgr
# agent parity` has to work from an installed wheel, not only from a checkout.
[tool.setuptools.package-data]
tlgr = ["data/*.json", "data/*.toml"]
