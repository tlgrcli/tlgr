# Catalog ids that are knowingly not covered, and why.
#
# Until PR-12 this file was a backlog: a waiver was a promise with a PR number
# on it, so `tlgr agent parity` could report "uncovered, waived until PR-9"
# instead of silently shrinking the denominator. Every one of those promises
# has now been kept, and what is left is a different thing entirely — nine ids
# that this build genuinely cannot cover, each naming the reason.
#
# **There are no blanket waivers.** No domain is waived, and no id is waived
# because "another PR owns it": that sentence has no meaning once every PR has
# landed. `kind` names which of the four permanent reasons applies:
#
#   layer-gap        the method arrived in an MTProto layer newer than the one
#                    Telethon 1.44 speaks; the command is registered and exits
#                    13 (NOT_SUPPORTED) with the method named
#   absent-method    the method exists in the layer but Telethon 1.44 ships no
#                    request class for it; the flag that needs it exits 13
#   prohibited       tlgr will not do it (spending money, deanonymising)
#   not-applicable   there is nothing for a CLI to do
#
# The gate in tests/test_parity.py enforces all of that: it refuses a domain
# waiver, refuses an unknown `kind`, refuses a waiver for an id that is in
# fact covered, and refuses a waiver whose reason does not name a method.
#
# Regenerate the catalog index with: python tools/prune_catalog.py

[meta]
catalog_version = "2026-09-02"
# The plan's last PR. Kept as a record of when the backlog emptied.
final_pr = 12

# ---------------------------------------------------------------------------
# Layer 229: `ephemeral.*` and the rich-message keyboard.
#
# Telethon 1.44 speaks layer 227 and has no TL classes for these, so tlgr has
# no request to send. Each command is registered and refuses with exit 13
# naming the method, because a command that is absent teaches an agent
# nothing while a command that refuses teaches it exactly what is missing.
# ---------------------------------------------------------------------------

[[id]]
id = "bots.ephemeral-command-send"
kind = "layer-gap"
reason = "`ephemeral.sendMessage` is a layer-229 method; `bot command send --ephemeral` is registered and exits 13."

[[id]]
id = "bots.ephemeral-callback-press"
kind = "layer-gap"
reason = "`ephemeral.getCallbackAnswer` is a layer-229 method; `bot press --ephemeral` is registered and exits 13."

[[id]]
id = "bots.ephemeral-message-send"
kind = "layer-gap"
reason = "`ephemeral.sendMessage` is a layer-229 method; the command is registered and exits 13."

[[id]]
id = "bots.ephemeral-report"
kind = "layer-gap"
reason = "`ephemeral.report` is a layer-229 method; the command is registered and exits 13."

[[id]]
id = "bots.welcome-messages-view"
kind = "layer-gap"
reason = "`ephemeral.getWelcomeMessages` is a layer-229 method; `chat welcome list` is registered and exits 13."

[[id]]
id = "bots.welcome-messages-manage"
kind = "layer-gap"
reason = "`ephemeral.sendMessage` / `ephemeral.editMessage` are layer-229 methods; `chat welcome set` is registered and exits 13."

[[id]]
id = "bots.rich-message-buttons"
kind = "layer-gap"
reason = "The rich-message keyboard constructors arrived in layer 229; tlgr refuses rather than guessing at a constructor id."

# ---------------------------------------------------------------------------
# Methods this Telethon has no request class for. The layer has them; the
# pinned library does not, so the *flag* that needs one refuses while the rest
# of its command still works.
# ---------------------------------------------------------------------------

[[id]]
id = "bots.chat-join-webview"
kind = "absent-method"
reason = "`messages.requestChatJoinWebView` is absent from Telethon 1.44; `webapp open --join-query-id` is registered and exits 13."

[[id]]
id = "gift.can-send"
kind = "absent-method"
reason = "`payments.canSendStarGift` is absent from Telethon 1.44; `gift catalog --until` is registered and exits 13, and the rest of the catalogue still reads."
