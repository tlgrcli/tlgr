# Catalog ids that are knowingly not covered yet, and by when.
#
# A waiver is a promise with a date on it, not an excuse: every entry names
# the PR that closes it, so `tlgr agent parity` can report "uncovered, waived
# until PR-9" instead of silently shrinking the denominator. The gate in
# tests/test_parity.py refuses to let a *covered* id become waived, which is
# what stops the file from being used to hide a regression.
#
# Regenerate the catalog index with: python tools/prune_catalog.py

[meta]
catalog_version = "2026-09-02"
# The last PR removes this file entirely (ARCHITECTURE §12.5).
