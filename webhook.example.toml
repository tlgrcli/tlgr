[webhook]
enabled = true
url = "http://127.0.0.1:18789/hooks/agent"
# The HMAC signing secret belongs out of this file's history. Set it with
#   tlgr webhook set --secret-env TLGR_WEBHOOK_SECRET
# which writes it to ~/.tlgr/webhook.toml (mode 0600) as `secret`.
# `tlgr events list` names every event type you can put below.
events = [
  "message_new",
  "message_edited",
  "message_deleted",
  "read_outbox",
]

[webhook.retry]
enabled = true
max_attempts = 3
backoff_base = 2  # seconds between retries (exponential)

[webhook.filters]
chats = []  # empty = all chats, or ["@channel", "-100123456"]
# Any gateway job filter works here too (tlgr/filters/README.md), e.g.
#   chat_type = "private"
#   contains = ["invoice"]
# With one set, event types Telethon has no event for (typing, for one) are
# not delivered, and the daemon logs that once per type.
